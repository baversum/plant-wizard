<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7c3aed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Plant Wizard</title>
<style>
  :root {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1e1b2e;
    --cyan: #0891b2;
    --cyan-soft: #ecfeff;
    --cyan-line: #a5f3fc;
    --cyan-ink: #0e7490;
    --violet: #7c3aed;
    --violet-soft: #f5f3ff;
    --violet-line: #ddd6fe;
    --violet-ink: #6d28d9;
    --ink: #1e1b2e;
    --muted: #6b687f;
    --line: #eae7f5;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 48px;
    background: linear-gradient(180deg, #eefcfd 0%, #f6f2ff 45%, #fbfaff 100%);
    min-height: 100vh;
  }
  header {
    position: relative;
    background: linear-gradient(120deg, #06b6d4 0%, #6366f1 55%, #a855f7 100%);
    color: #fff; padding: 26px 16px 22px;
    border-radius: 0 0 26px 26px;
    box-shadow: 0 8px 24px rgba(124, 58, 237, .25);
  }
  header .inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  header svg.leaf { flex: 0 0 auto; width: 40px; height: 40px; }
  header h1 { font-size: 1.35rem; margin: 0; letter-spacing: .3px; }
  header p { margin: 3px 0 0; font-size: 0.8rem; opacity: .85; }
  .langbtn {
    position: absolute; top: 14px; right: 14px;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px; padding: 4px 5px; cursor: pointer; line-height: 0;
    display: flex; align-items: center;
  }
  .langbtn:hover { background: rgba(255,255,255,.38); }
  .langbtn svg { width: 24px; height: 16px; border-radius: 2px; display: block; }
  nav {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 4px;
    background: rgba(251, 250, 255, .88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    justify-content: center;
  }
  nav button {
    border: 0; background: transparent; padding: 8px 18px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; color: var(--muted); cursor: pointer;
    transition: all .15s ease;
  }
  nav button.active {
    background: linear-gradient(120deg, #06b6d4, #8b5cf6);
    color: #fff; box-shadow: 0 3px 10px rgba(139, 92, 246, .35);
  }
  main { max-width: 900px; margin: 0 auto; padding: 14px 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(124, 58, 237, .06);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    color: var(--muted); background: var(--violet-soft);
  }
  .badge.dark { background: var(--violet-soft); color: var(--violet-ink); border-color: var(--violet-line); }
  .badge.ghost { background: #f6f4fc; color: var(--muted); }
  .banner {
    border-radius: 12px; padding: 9px 12px; font-size: 0.85rem; font-weight: 600;
    margin: 10px 0; border: 1px solid; border-left-width: 4px;
  }
  .due   { background: var(--violet-soft); border-color: var(--violet-line); border-left-color: var(--violet); color: var(--violet-ink); }
  .wait  { background: var(--cyan-soft);   border-color: var(--cyan-line);   border-left-color: var(--cyan);   color: var(--cyan-ink); }
  .pause { background: #f4f4f8; border-color: #e4e4ec; border-left-color: #a5a5ba; color: #55526b; }
  .grey  { background: #f8f7fb; border-color: var(--line); border-left-color: #c9c6d8; color: #908ca6; }
  button.btn {
    border: 0; background: linear-gradient(120deg, #06b6d4, #8b5cf6); color: #fff;
    padding: 8px 14px; font-size: 0.8rem; border-radius: 10px; cursor: pointer;
    font-weight: 600; box-shadow: 0 2px 8px rgba(139, 92, 246, .3);
  }
  button.btn.outline {
    background: #fff; color: var(--violet-ink); border: 1px solid var(--violet-line);
    box-shadow: none;
  }
  button.btn.mini { padding: 5px 11px; font-weight: 500; }
  button.x { border: 0; background: transparent; color: #b0adc0; cursor: pointer; font-size: 0.8rem; padding: 4px; }
  button.x:hover { color: #dc2626; background: #fef2f2; border-radius: 6px; }
  .name { font-weight: 700; font-size: 0.95rem; }
  .small { font-size: 0.75rem; color: var(--muted); }
  .foot { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  select, input[type="text"] {
    border: 1px solid #d8d4e8; border-radius: 10px; padding: 7px 9px; font-size: 0.85rem;
    background: #fff; color: var(--ink); max-width: 100%;
  }
  select:focus, input[type="text"]:focus { outline: 2px solid var(--cyan-line); outline-offset: 0; border-color: var(--cyan); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #8b5cf6; }
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #eeeaf8; margin: 6px 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .legend span { font-size: 0.68rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f4f2fa; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .stock-item { display: flex; gap: 10px; padding: 8px; border-radius: 10px; align-items: flex-start; }
  .stock-item:hover { background: var(--violet-soft); }
  .stock-item.owned .label { text-decoration: line-through; color: #b0adc0; }
  .label { font-weight: 600; font-size: 0.85rem; }
  .filters button {
    border: 0; background: transparent; padding: 5px 13px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .filters button.active {
    background: linear-gradient(120deg, #06b6d4, #8b5cf6); color: #fff;
  }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .tl { margin: 10px 0 4px; }
  .tl-head, .tl-row { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; }
  .tl-head span { font-size: 0.58rem; color: var(--muted); text-align: center; }
  .tl-row { height: 10px; margin-top: 3px; }
  .tl-row span { background: #edebf7; border-radius: 3px; }
  .tl-row.cov span { background: #c4b5fd; }
  .tl-row.cov span.gap { background: #fbbf24; }
  .badge .x { font-size: 0.75rem; padding: 0 3px; }
  @media (max-width: 600px) {
    nav button { padding: 8px 11px; font-size: 0.78rem; }
    header .inner { justify-content: center; text-align: center; flex-direction: column; gap: 6px; }
    .langbtn { top: 10px; right: 10px; }
  }
</style>
</head>
<body>
<header>
  <button class="langbtn" id="langbtn" title="Français" aria-label="Switch language"></button>
  <div class="inner">
    <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22c0-6 2-13 9-16-.5 9-4 14-9 16z" fill="rgba(255,255,255,.18)"/>
      <path d="M12 22c0-5-1.5-10-6-13 .5 7 3 10.5 6 13z" fill="rgba(255,255,255,.10)"/>
    </svg>
    <div>
      <h1>Plant Wizard</h1>
      <p id="subtitle">Soil mixes &amp; fertilizer, by observation</p>
    </div>
  </div>
</header>
<nav>
  <button data-tab="plantes" class="active" id="nav-plantes">My plants</button>
  <button data-tab="melanges" id="nav-melanges">Mixes</button>
  <button data-tab="vasques" id="nav-vasques">Planters</button>

</nav>

          return { plants: p.plants, owned: Array.isArray(p.owned) ? p.owned : [] };

    } catch (e) { /* storage unavailable */ }

  }

  // ---------- Helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {

  // ---------- Vasques helpers & rendering ----------
  function currentMonth() {
    if (typeof PW_TEST_MONTH !== "undefined") return PW_TEST_MONTH;
    return new Date().getMonth();
  }
  function vp(id) {
    for (var i = 0; i < VASE_PLANTS.length; i++) if (VASE_PLANTS[i].id === id) return VASE_PLANTS[i];
    return VASE_PLANTS[0];
  }
  function vpName(p) { return lang === "fr" ? p.fr : p.en; }
  function vqSunLabel(s) {
    var m = lang === "fr" ? { sun: "Soleil", half: "Mi-ombre", shade: "Ombre" } : { sun: "Sun", half: "Part shade", shade: "Shade" };
    return m[s] || s;
  }
  function monthLabel(m) { return MONTHS[lang][((m % 12) + 12) % 12]; }
  function monthWindow(arr) {
    if (!arr || !arr.length) return "";
    var a = MONTHS[lang];
    var set = {}; arr.forEach(function (m) { set[m] = true; });
    var runs = [], i = 0;
    while (i < 12) {
      if (!set[i]) { i++; continue; }
      var start = i;
      while (i < start + 11 && set[(i + 1) % 12]) i++;
      runs.push([start, i % 12]);
      i++;
    }
    return runs.map(function (r) { return a[r[0]] + (r[0] !== r[1] ? "–" + a[r[1]] : ""); }).join(", ");
  }
  function vqSurf(v) { return Math.max(v.volume, 5) / 200; } // m² estimate (39 L ≈ Ø 50 cm)
  function vqQty(p, v) {
    return p.type === "bulb"
      ? Math.max(1, Math.round(vqSurf(v) * p.bulbsPerM2))
      : Math.max(1, Math.floor(v.volume / p.lpp));
  }
  function vqDensityStr(p) {
    return p.type === "bulb"
      ? "~" + p.bulbsPerM2 + "/m²"
      : (lang === "fr" ? "1 tous les " + p.lpp + " L" : "1 every " + p.lpp + " L");
  }
  function tlHead() {
    var h = '<div class="tl-head">';
    for (var m = 0; m < 12; m++) h += "<span>" + esc(monthLabel(m).charAt(0)) + "</span>";
    return h + "</div>";
  }
  function tlRow(months, color, title) {
    var h = '<div class="tl-row" title="' + esc(title) + '">';
    for (var m = 0; m < 12; m++) {
      var on = months.indexOf(m) > -1;
      h += "<span" + (on ? ' style="background:' + color + '"' : "") + "></span>";
    }
    return h + "</div>";
  }
  function vqCoverage(v) {
    var cov = [];
    for (var m = 0; m < 12; m++) cov.push(false);
    v.entries.forEach(function (e) {
      vp(e.pid).bloom.forEach(function (m) { cov[m] = true; });
    });
    return cov;
  }
  function tlCoverage(cov) {
    var h = '<div class="tl-row cov" title="' + esc(T.vqCoverage) + '">';
    for (var m = 0; m < 12; m++) h += '<span class="' + (cov[m] ? "" : "gap") + '"></span>';
    return h + "</div>";
  }
  function vqTasks(v, m) {
    var out = { removes: [], plants: [], bloomNow: [], fullReset: false };
    v.entries.forEach(function (e) {
      var p = vp(e.pid);
      if (p.bloom.indexOf(m) > -1) out.bloomNow.push({ p: p, e: e });
      if (p.remove && p.remove.indexOf(m) > -1) out.removes.push({ p: p, e: e });
    });
    if (v.mode === "full" && (m === 3 || m === 9)) {
      out.fullReset = true;
      v.entries.forEach(function (e) {
        var p = vp(e.pid);
        if (p.role === "socle" && !(p.remove && p.remove.indexOf(m) > -1)) out.removes.push({ p: p, e: e, reset: true });
      });
    }
    VASE_PLANTS.forEach(function (p) {
      if (p.plant.indexOf(m) < 0) return;
      if (p.sun.indexOf(v.sun) < 0) return;
      var already = v.entries.some(function (e) { return e.pid === p.id; });
      if (already) return;
      out.plants.push(p);
    });
    out.plants.sort(function (a, b) {
      var rk = function (p) { return p.role === "socle" ? 0 : p.type === "bulb" ? 1 : 2; };
      return rk(a) - rk(b);
    });
    return out;
  }
  function vqGapLine(v, m, t) {
    if (!v.entries.length) return "";
    var cov = vqCoverage(v);
    var sug = {};
    t.plants.forEach(function (p) { p.bloom.forEach(function (bm) { sug[bm] = true; }); });
    var gaps = [];
    for (var k = 1; k <= 5; k++) {
      var gm = (m + k) % 12;
      if (!cov[gm]) gaps.push(gm);
    }
    if (!gaps.length) return "";
    var uncovered = gaps.filter(function (gm) { return !sug[gm]; });
    var h = '<div class="banner grey" style="margin:8px 0 4px">' + T.vqGapPre + " " +
      gaps.map(function (gm) { return monthLabel(gm); }).join(", ") + " — ";
    if (!uncovered.length) {
      h += T.vqGapOk;
    } else {
      var seen = {};
      var fixes = [];
      uncovered.forEach(function (gm) {
        for (var i = 0; i < VASE_PLANTS.length; i++) {
          var p = VASE_PLANTS[i];
          if (p.bloom.indexOf(gm) < 0 || p.sun.indexOf(v.sun) < 0 || seen[p.id]) continue;
          if (!p.plant.some(function (pm) { var d = (pm - m + 12) % 12; return d <= k5max(gm, m); })) continue;
          seen[p.id] = true;
          fixes.push(p);
          break;
        }
      });
      h += T.vqGapWarn + " " + fixes.map(function (p) { return esc(vpName(p)) + " (" + monthWindow(p.plant) + ")"; }).join(", ") + ".";
    }
    return h + "</div>";
  }
  function k5max(gm, m) { return (gm - m + 12) % 12; }
  function renderVasques() {
    var m = currentMonth();
    var h = '<div class="banner wait" style="margin-bottom:12px">' + T.vqIntro + "</div>";

    h += '<div class="card"><div class="addform">' +
      '<span class="label" style="font-size:0.85rem">' + T.vqNew + "</span>" +
      '<input type="text" id="vq-name" placeholder="' + T.vqNamePh + '" style="width:150px" />' +
      '<input type="number" id="vq-volume" min="5" max="500" value="39" style="width:64px" title="Litres" />' +
      '<span class="small">' + T.vqVolume + "</span>" +
      '<select id="vq-sun">' +
        '<option value="sun">' + T.vqSunS + "</option>" +
        '<option value="half">' + T.vqSunH + "</option>" +
        '<option value="shade">' + T.vqSunSh + "</option>" +
      "</select>" +
      '<select id="vq-mode" title="' + esc(T.vqModeHint) + '">' +
        '<option value="socle">' + T.vqModeSocle + "</option>" +
        '<option value="full">' + T.vqModeFull + "</option>" +
      "</select>" +
      '<button class="btn mini" data-action="vq-new">' + T.vqAdd + "</button></div></div>";

    if (!vasques.length) h += '<div class="card small">' + T.vqEmpty + "</div>";

    vasques.forEach(function (v) {
      var t = vqTasks(v, m);
      h += '<div class="card">' +
        '<div class="row between"><div><div class="name">' + esc(v.name) + "</div>" +
        '<span class="badge" style="margin-top:4px">' + v.volume + " L · " + vqSunLabel(v.sun) + " · " + (v.mode === "full" ? T.vqModeFull : T.vqModeSocle) + "</span></div>" +
        '<button class="x" data-action="vq-del" data-vid="' + v.id + '" title="' + T.vqDelete + '">×</button></div>';

      h += '<div class="tl">' + tlHead();
      v.entries.forEach(function (e) {
        var p = vp(e.pid);
        var col = p.role === "socle" ? "#0e7490" : p.type === "bulb" ? "#a16207" : "#8b5cf6";
        h += tlRow(p.bloom, col, vpName(p) + " ×" + e.qty + " — " + monthWindow(p.bloom));
      });
      if (v.entries.length) h += tlCoverage(vqCoverage(v));
      h += '</div><div class="legend">' +
        "<span><i class=\"dot\" style=\"background:#0e7490\"></i>" + T.vqLegSocle + "</span>" +
        "<span><i class=\"dot\" style=\"background:#8b5cf6\"></i>" + T.vqLegCov + "</span>" +
        "<span><i class=\"dot\" style=\"background:#a16207\"></i>" + T.vqLegBulb + "</span>" +
        "<span><i class=\"dot\" style=\"background:#fbbf24\"></i>" + T.vqLegGap + "</span></div>";

      h += '<div class="foot"><strong>' + T.vqThisMonth + "</strong>";
      if (t.fullReset) h += '<div class="banner wait" style="margin:8px 0 2px">' + T.vqFullReset + "</div>";
      t.bloomNow.forEach(function (b) {
        h += '<div class="small" style="margin:6px 0 0">' + T.vqBloomNow + " " +
          '<span class="badge dark">' + esc(vpName(b.p)) + " ×" + b.e.qty + "</span></div>";
      });
      var fertNow = [];
      v.entries.forEach(function (e) {
        var p = vp(e.pid);
        if (p.fertFr && p.bloom.indexOf(m) > -1) fertNow.push(p);
      });
      if (fertNow.length) {
        h += '<div class="small" style="margin:6px 0 0">' + T.vqFertLine + " " +
          fertNow.map(function (p) {
            return '<span class="badge">' + esc(vpName(p)) + " : " + esc(lang === "fr" ? p.fertFr : p.fertEn) + "</span>";
          }).join(" ") + "</div>";
      }
      t.removes.forEach(function (r) {
        h += '<div class="banner due" style="margin:8px 0 4px">' + esc(vpName(r.p)) + " ×" + r.e.qty + " — " +
          esc(r.reset ? T.vqResetSocle : (lang === "fr" ? r.p.rmFr : r.p.rmEn)) +
          ' <button class="btn mini outline" data-action="vq-remove" data-vid="' + v.id + '" data-pid="' + r.p.id + '" style="margin-left:6px">' + T.vqRemoveBtn + "</button></div>";
      });
      if (t.plants.length) {
        h += '<div class="small" style="margin:8px 0 2px">' + T.vqPlantNow + "</div>" + '<div class="chips">';
        t.plants.forEach(function (p) {
          h += '<span class="badge" style="padding:4px 10px">' + esc(vpName(p)) + " ×" + vqQty(p, v) + " " +
            (p.type === "bulb" ? T.vqBulbs : T.vqPlantsW) +
            ' <button class="x" data-action="vq-add" data-vid="' + v.id + '" data-pid="' + p.id + '" title="' + T.vqAdd + '">+</button></span>';
        });
        h += "</div>" + '<div class="small" style="color:var(--muted);margin-top:4px">' + T.vqUnderlayer + "</div>";
      }
      h += vqGapLine(v, m, t);
      if (!t.removes.length && !t.plants.length && !t.bloomNow.length && !t.fullReset && !vqGapLine(v, m, t)) {
        h += '<div class="banner pause" style="margin:8px 0">' + T.vqNothing + "</div>";
      }
      h += "</div>";

      h += '<div class="foot"><strong>' + T.vqContents + "</strong>";
      if (!v.entries.length) h += ' <span class="small">' + T.vqEmptyContents + "</span>";
      else {
        h += '<div class="chips" style="margin:6px 0">';
        v.entries.forEach(function (e) {
          var p = vp(e.pid);
          h += '<span class="badge ghost" title="' + esc(lang === "fr" ? p.noteFr : p.noteEn) + '">' +
            esc(vpName(p)) + " ×" + e.qty +
            ' <button class="x" data-action="vq-remove" data-vid="' + v.id + '" data-pid="' + p.id + '">×</button></span>';
        });
        h += "</div>";
      }
      h += '<div class="addform" style="margin-top:8px">' +
        '<select id="vq-p-' + v.id + '">' +
        VASE_PLANTS.map(function (p) {
          return '<option value="' + p.id + '">' + esc(vpName(p)) + " — " + vqDensityStr(p) + "</option>";
        }).join("") +
        "</select>" +
        '<input type="number" id="vq-q-' + v.id + '" min="1" value="1" style="width:60px" />' +
        '<button class="btn mini" data-action="vq-addmanual" data-vid="' + v.id + '">' + T.vqAdd + "</button></div>";
      h += "</div></div>";
    });

    h += '<div class="card"><strong>' + T.vqCalendar + '</strong>' +
      '<div class="small" style="margin:4px 0">' + T.vqCalendarNote + "</div>" +
      '<table><tr>';
    T.vqCalCols.forEach(function (c) { h += "<th>" + esc(c) + "</th>"; });
    h += "</tr>";
    VASE_PLANTS.slice().sort(function (a, b) {
      var sk = function (p) {
        if (p.role === "socle") return 0;
        return (p.plant.indexOf(8) > -1 || p.plant.indexOf(9) > -1 || p.plant.indexOf(10) > -1 || p.plant.indexOf(11) > -1) ? 1 : 2;
      };
      return sk(a) - sk(b);
    }).forEach(function (p) {
      h += "<tr><td><strong>" + esc(vpName(p)) + '</strong> <span class="badge ghost" style="font-size:0.6rem">' + T.vqRoles[p.role] + "</span></td>" +
        "<td>" + monthWindow(p.plant) + "</td><td>" + monthWindow(p.bloom) + "</td>" +
        "<td>" + vqDensityStr(p) + "</td><td>" + p.sun.map(vqSunLabel).join(", ") + "</td>" +
        "<td>" + (p.fertFr ? esc(lang === "fr" ? p.fertFr : p.fertEn) : "—") + "</td></tr>";
    });
    h += "</table></div>";

    view.innerHTML = h;
  }

  function renderChrome() {
    document.documentElement.setAttribute("lang", lang);
    var sub = document.getElementById("subtitle");
    if (sub) sub.textContent = T.subtitle;
    var btn = document.getElementById("langbtn");
    if (btn) {
      btn.innerHTML = lang === "fr" ? FLAG_EN : FLAG_FR;
      btn.title = lang === "fr" ? "English" : "Français";
      btn.setAttribute("aria-label", lang === "fr" ? "Switch to English" : "Passer en français");
    }
    document.getElementById("nav-plantes").textContent = T.nav.plantes;
    document.getElementById("nav-melanges").textContent = T.nav.melanges;
    document.getElementById("nav-vasques").textContent = T.nav.vasques;
    document.getElementById("nav-stock").textContent = T.nav.stock;
  }

  function render() {
    renderChrome();
    document.querySelectorAll("nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    if (tab === "plantes") renderPlants();
    else if (tab === "melanges") renderMixes();
    else if (tab === "vasques") renderVasques();
    else renderStock();
  }

  // ---------- Events ----------
  document.getElementById("langbtn").addEventListener("click", function () {
    lang = lang === "fr" ? "en" : "fr";
    T = STR[lang];
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    render();
  });

  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      tab = b.getAttribute("data-tab");
      filter = "all";
      render();
    });
  });

  view.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action],[data-filter]");
    if (!el) return;

    if (el.hasAttribute("data-filter")) {
      filter = el.getAttribute("data-filter");
      render();
      return;
    }
    var action = el.getAttribute("data-action");
    if (action === "water") {
      var id = el.getAttribute("data-id");
      var fert = el.getAttribute("data-fert") === "1";
      state.plants.forEach(function (p) {
        if (p.id === id) p.sinceFert = fert ? 0 : p.sinceFert + 1;
      });
      save(); render();
    } else if (action === "remove") {
      var rid = el.getAttribute("data-id");
      state.plants = state.plants.filter(function (p) { return p.id !== rid; });
      save(); render();
    } else if (action === "add") {
      var gsel = document.getElementById("f-group");
      var psel = document.getElementById("f-plant");
      var nameIn = document.getElementById("f-name");
      var name = (nameIn.value || "").trim() || psel.value;
      state.plants.push({ id: uid(), name: name, groupId: gsel.value, sinceFert: 0 });
      if (nameIn) nameIn.value = "";
      save(); render();
    } else if (action === "vq-new") {
      var vqNm = document.getElementById("vq-name");
      var vqVol = document.getElementById("vq-volume");
      var vqSun = document.getElementById("vq-sun");
      var vqMode = document.getElementById("vq-mode");
      vasques.push({
        id: uid(),
        name: (vqNm && vqNm.value ? vqNm.value : "").trim() || (lang === "fr" ? "Vasque" : "Planter"),
        volume: Math.max(5, Math.min(500, parseInt(vqVol && vqVol.value, 10) || 39)),
        sun: vqSun && ["sun", "half", "shade"].indexOf(vqSun.value) > -1 ? vqSun.value : "sun",
        mode: vqMode && vqMode.value === "full" ? "full" : "socle",
        entries: []
      });
      if (vqNm) vqNm.value = "";
      saveVasques(); render();
    } else if (action === "vq-del") {
      var vqVid = el.getAttribute("data-vid");
      vasques = vasques.filter(function (x) { return x.id !== vqVid; });
      saveVasques(); render();
    } else if (action === "vq-remove") {
      var vqVid2 = el.getAttribute("data-vid"), vqPid = el.getAttribute("data-pid");
      vasques.forEach(function (x) {
        if (x.id === vqVid2) x.entries = x.entries.filter(function (e2) { return e2.pid !== vqPid; });
      });
      saveVasques(); render();
    } else if (action === "vq-add") {
      var vqVid3 = el.getAttribute("data-vid"), vqPid2 = el.getAttribute("data-pid");
      vasques.forEach(function (x) {
        if (x.id !== vqVid3) return;
        var q = vqQty(vp(vqPid2), x);
        var ex = null;
        x.entries.forEach(function (e2) { if (e2.pid === vqPid2) ex = e2; });
        if (ex) ex.qty += q; else x.entries.push({ pid: vqPid2, qty: q });
      });
      saveVasques(); render();
    } else if (action === "vq-addmanual") {
      var vqVid4 = el.getAttribute("data-vid");
      var vqPs = document.getElementById("vq-p-" + vqVid4);
      var vqQs = document.getElementById("vq-q-" + vqVid4);
      var vqPid3 = vqPs ? vqPs.value : VASE_PLANTS[0].id;
      var vqN = Math.max(1, parseInt(vqQs && vqQs.value, 10) || 1);
      vasques.forEach(function (x) {
        if (x.id !== vqVid4) return;
        var ex = null;
        x.entries.forEach(function (e2) { if (e2.pid === vqPid3) ex = e2; });
        if (ex) ex.qty += vqN; else x.entries.push({ pid: vqPid3, qty: vqN });
      });
      saveVasques(); render();
    }
  });

  view.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "f-group") {
      addGroup = el.value;
      var psel = document.getElementById("f-plant");
      var g = grp(addGroup);
      psel.innerHTML = g.plants.map(function (pn) {
        return '<option value="' + esc(pn) + '">' + esc(plantName(pn)) + "</option>";
      }).join("");
      return;
    }
    if (el.hasAttribute("data-stock")) {
      var id = el.getAttribute("data-stock");
      var idx = state.owned.indexOf(id);
      if (el.checked && idx < 0) state.owned.push(id);
      if (!el.checked && idx >= 0) state.owned.splice(idx, 1);
      save();
      var lab = el.closest(".stock-item");
      if (lab) lab.classList.toggle("owned", el.checked);
    }
  });

  render();
})();
</script>
</body>
</html>
