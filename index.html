<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Plant Wizard</title>
<style>
  :root {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
    background: #f1f5f9;
    --amber-bg: #fffbeb; --amber-bd: #fde68a; --amber-tx: #92400e;
    --sky-bg: #f0f9ff; --sky-bd: #bae6fd; --sky-tx: #075985;
    --slate-bg: #f8fafc; --slate-bd: #e2e8f0; --slate-tx: #475569;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 0 48px; }
  header { padding: 16px 16px 8px; max-width: 900px; margin: 0 auto; }
  header h1 { font-size: 1.25rem; margin: 0; }
  header p { margin: 2px 0 0; font-size: 0.8rem; color: #64748b; }
  nav {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 4px;
    background: #f1f5f9; padding: 8px 16px; border-bottom: 1px solid #e2e8f0;
    justify-content: center;
  }
  nav button {
    border: 0; background: transparent; padding: 8px 14px; border-radius: 10px;
    font-size: 0.85rem; font-weight: 600; color: #475569; cursor: pointer;
  }
  nav button.active { background: #0f172a; color: #fff; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 16px; }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(15,23,42,.05);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem;
    border: 1px solid #e2e8f0; border-radius: 999px; padding: 2px 9px; color: #475569;
    background: #fff;
  }
  .badge.dark { background: #fef3c7; color: #92400e; border-color: #fde68a; }
  .badge.ghost { background: #f1f5f9; color: #64748b; }
  .banner {
    border-radius: 10px; padding: 8px 12px; font-size: 0.85rem; font-weight: 600;
    margin: 10px 0; border: 1px solid;
  }
  .amber { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber-tx); }
  .sky   { background: var(--sky-bg);   border-color: var(--sky-bd);   color: var(--sky-tx); }
  .slate { background: var(--slate-bg); border-color: var(--slate-bd); color: var(--slate-tx); }
  .grey  { background: #f8fafc; border-color: #e2e8f0; color: #94a3b8; }
  button.btn {
    border: 0; background: #0f172a; color: #fff; padding: 7px 12px; font-size: 0.8rem;
    border-radius: 9px; cursor: pointer; font-weight: 600;
  }
  button.btn.outline { background: #fff; color: #334155; border: 1px solid #cbd5e1; }
  button.btn.mini { padding: 5px 10px; font-weight: 500; }
  button.x { border: 0; background: transparent; color: #94a3b8; cursor: pointer; font-size: 0.8rem; padding: 4px; }
  button.x:hover { color: #dc2626; background: #fef2f2; border-radius: 6px; }
  .name { font-weight: 700; font-size: 0.95rem; }
  .small { font-size: 0.75rem; color: #64748b; }
  .foot { border-top: 1px solid #f1f5f9; margin-top: 10px; padding-top: 8px; }
  select, input[type="text"] {
    border: 1px solid #cbd5e1; border-radius: 9px; padding: 7px 8px; font-size: 0.85rem;
    background: #fff; color: #0f172a; max-width: 100%;
  }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #059669; }
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #e2e8f0; margin: 6px 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .legend span { font-size: 0.68rem; color: #64748b; display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
  th { color: #64748b; font-weight: 600; }
  .stock-item { display: flex; gap: 10px; padding: 8px; border-radius: 10px; align-items: flex-start; }
  .stock-item:hover { background: #f8fafc; }
  .stock-item.owned .label { text-decoration: line-through; color: #94a3b8; }
  .label { font-weight: 600; font-size: 0.85rem; }
  .filters button {
    border: 0; background: transparent; padding: 5px 12px; border-radius: 8px;
    font-size: 0.75rem; font-weight: 600; color: #475569; cursor: pointer;
  }
  .filters button.active { background: #0f172a; color: #fff; }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  @media (max-width: 600px) { nav button { padding: 8px 10px; font-size: 0.78rem; } }
</style>
</head>
<body>
<header>
  <h1>🪴 Plant Wizard</h1>
  <p>Soil mixes &amp; fertilizer, by observation</p>
</header>
<nav>
  <button data-tab="plantes" class="active">💧 My plants</button>
  <button data-tab="melanges">🧱 Mixes</button>
  <button data-tab="stock">🛒 Stock</button>
</nav>
<main id="view"></main>

<script>
(function () {
  "use strict";

  // ---------- Data ----------
  var MIX_COLORS = {
    "Potting soil": "#8B5E3C", "Bark": "#A16207", "Crushed bark": "#A16207",
    "Pumice": "#D2691E", "Coco": "#E3B23C", "Sand": "#D6BD8A",
    "Compost": "#4E342E", "Ericaceous soil": "#556B2F", "Garden soil": "#7A5C3E"
  };

  function G(id, name, icon, zone, mix, fertEvery, note, plants) {
    return { id: id, name: name, icon: icon, zone: zone, mix: mix, fertEvery: fertEvery, note: note, plants: plants };
  }
  function M(label, pct) { return { label: label, pct: pct }; }

  var GROUPS = [
    G("tropicals", "Tropicals & aroids", "🌿", "Indoor",
      [M("Potting soil", 40), M("Bark", 25), M("Pumice", 20), M("Coco", 15)], 2,
      "Let the top centimetre dry out between waterings.",
      ["Pothos", "Monstera", "Aglaonema", "Ficus", "ZZ", "Philodendron", "Syngonium"]),
    G("anthurium", "Anthuriums", "🌺", "Indoor",
      [M("Potting soil", 30), M("Bark", 35), M("Coco", 20), M("Pumice", 15)], 2,
      "Thick roots: never leave water sitting in the saucer. The airiest mix of them all. A flowering fertilizer helps push blooms.",
      ["Anthurium"]),
    G("semi-succulents", "Semi-succulents", "🌾", "Indoor",
      [M("Potting soil", 55), M("Pumice", 30), M("Crushed bark", 15)], 3,
      "Should dry out in 2–3 days. Stems turning black at the base means too wet.",
      ["Tradescantia", "Kalanchoe", "Gasteraloe"]),
    G("cacti", "Succulents & cacti", "🌵", "Indoor",
      [M("Potting soil", 35), M("Pumice", 45), M("Sand", 20)], 4,
      "Let it dry fully between waterings. Fertilize rarely, at half dose.",
      ["Cactus", "Echeveria", "Haworthia", "Crassula"]),
    G("epiphytes", "Forest epiphytes", "🎄", "Indoor",
      [M("Potting soil", 50), M("Bark", 25), M("Pumice", 25)], 3,
      "Rich yet very free-draining. Never bone dry.",
      ["Christmas cactus", "Rhipsalis"]),
    G("fine-roots", "Fine-rooted plants", "🍃", "Indoor",
      [M("Potting soil", 70), M("Pumice", 20), M("Coco", 10)], 2,
      "Everything crushed, for small pots.",
      ["Oxalis", "Begonia", "Peperomia", "Fittonia"]),
    G("bulbs", "Bulbs & tubers", "🌷", "Indoor",
      [M("Potting soil", 60), M("Compost", 20), M("Pumice", 20)], 2,
      "Calla lilies never want to dry out in the growing season. Amaryllis: high-potash feed after bloom to refill the bulb.",
      ["Amaryllis", "Zantedeschia (calla)", "Cyperus"]),
    G("ferns", "Ferns", "🌱", "Indoor",
      [M("Potting soil", 60), M("Coco", 25), M("Pumice", 15)], 2,
      "Keep evenly moist, never soggy.",
      ["Boston fern", "Pteris"]),
    G("orchids", "Orchids", "🌸", "Indoor",
      [M("Bark", 90), M("Pumice", 10)], 3,
      "Soak the pot for 10 minutes, then drain. Balanced fertilizer at half dose on damp roots.",
      ["Phalaenopsis"]),
    G("mediterranean", "Mediterranean (potted)", "☀️", "Outdoor",
      [M("Potting soil", 40), M("Pumice", 30), M("Sand", 20), M("Compost", 10)], 4,
      "Once established, water sparingly. Protect pots from frost — roots in pots get the cold first. Fermented teas from March to October.",
      ["Strawberry tree", "Olive", "Lavender", "Rosemary", "Pomegranate"]),
    G("potted-flowers", "Flowering container plants", "🪴", "Outdoor",
      [M("Potting soil", 50), M("Garden soil", 25), M("Pumice", 25)], 1,
      "Petunias and surfinias: flowering fertilizer weekly in summer — the hungriest plants in the garden. Empty the saucer.",
      ["Geranium", "Surfinia", "Petunia", "Pelargonium"]),
    G("rockery", "Rockery succulents", "🪨", "Outdoor",
      [M("Potting soil", 25), M("Pumice", 75)], null,
      "Water only at planting and in heatwaves. Mineral mulch on top, zero fertilizer.",
      ["Sedum", "Sempervivum", "Delosperma"]),
    G("acid-lovers", "Acid-loving plants", "🫐", "Outdoor",
      [M("Ericaceous soil", 60), M("Crushed bark", 20), M("Pumice", 20)], 3,
      "pH 4.5–5.5: no lime, ever. Rainwater only. Chelated iron when the leaves turn yellow (chlorosis).",
      ["Blueberry", "Camellia", "Hydrangea", "Azalea"]),
    G("open-ground", "Open ground", "🌳", "Outdoor",
      [M("Compost", 100)], null,
      "Mature compost at planting, nothing else. Hellebores like chalky, deep soil; if potted, a handful of slow-release granules each autumn.",
      ["Hellebore", "Mulberry", "Shrub", "Perennial"])
  ];

  var STOCK = [
    { cat: "🧱 Substrates", items: [
      { id: "potting-soil", label: "Quality all-purpose potting soil", note: "The base of every mix" },
      { id: "bark", label: "Pine bark 10/25 mm", note: "Soak overnight before use; crush for small pots" },
      { id: "coco", label: "Coco coir (bricks)", note: "Rehydrate before mixing" },
      { id: "pumice", label: "Pumice 8/16 mm", note: "The one mineral that does it all — hammer-crush for small pots" },
      { id: "ericaceous", label: "Ericaceous potting soil", note: "Acid-lovers only (blueberry, camellia, hydrangea…)" },
      { id: "compost", label: "Mature compost", note: "Open ground + bulbs" }
    ]},
    { cat: "🧪 Fertilizers (a stack of 3)", items: [
      { id: "fermented-teas", label: "Fermented nettle + horsetail + comfrey blend (5 L → 100 L)", note: "The everyday feed, indoors and out: nitrogen + potash + silica. Diluted to 5 %, every 2–3 weeks, March to October" },
      { id: "bloom-feed", label: "Liquid flowering fertilizer, high P-K (Algoflash 1 L or similar)", note: "Bloomers: anthurium, calla, begonia, oxalis, amaryllis after bloom; petunias and surfinias weekly in summer" },
      { id: "chelated-iron", label: "Chelated iron (Sequestrine-type) or ericaceous fertilizer", note: "For acid-lovers (blueberry) when leaves turn yellow" }
    ]},
    { cat: "🪵 Mulch & supplies", items: [
      { id: "bark-mulch", label: "Pine bark (surface mulch)", note: "Strawberry trees, Mediterranean pots" },
      { id: "pumice-mulch", label: "Pumice (mineral mulch)", note: "Rockery, pot surfaces" },
      { id: "pots", label: "Drilled pots + saucers", note: "Empty the saucer after every watering" }
    ]}
  ];

  var SUBST = [
    ["Pumice", "Perlite", "Same volume", "Lighter and floats: fine indoors, avoid outdoors"],
    ["Pumice", "Crushed clay pebbles", "Same volume", "Rinse off the crushing dust"],
    ["Pumice", "Whole clay pebbles 8/16", "Same (large pots)", "Less aeration: add 5 % more if the mix stays dense"],
    ["Pumice", "Filter sand (0.4–0.8 mm)", "÷ 2 — e.g. 30 % → 15 %", "Sand densifies instead of aerating. Keep it under 20 % of the mix and top up with potting soil"],
    ["Pumice", "Concrete gravel 4/8", "Same volume", "Often limestone (alkaline): never for acid-lovers"],
    ["Bark", "Crushed pumice", "Same volume", "A slightly drier mix: water a little more often"],
    ["Coco", "Blonde peat", "Same volume", "Peat needs rehydrating too"]
  ];

  // ---------- State ----------
  var LS_KEY = "plant-wizard-v1";
  var SEED = [
    ["Pothos", "tropicals"], ["Monstera", "tropicals"], ["Anthurium", "anthurium"],
    ["Tradescantia", "semi-succulents"], ["Christmas cactus", "epiphytes"],
    ["Amaryllis", "bulbs"], ["Strawberry tree", "mediterranean"],
    ["Blueberry", "acid-lovers"], ["Geranium", "potted-flowers"]
  ];

  function seedPlants() {
    return SEED.map(function (s) { return { id: uid(), name: s[0], groupId: s[1], sinceFert: 0 }; });
  }
  function uid() {
    return "p-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (Array.isArray(p.plants)) {
          return { plants: p.plants, owned: Array.isArray(p.owned) ? p.owned : [] };
        }
      }
    } catch (e) { /* storage unavailable */ }
    return { plants: seedPlants(), owned: [] };
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* in-memory only */ }
  }

  var state = loadState();
  var tab = "plantes";
  var filter = "all";
  var addGroup = GROUPS[0].id;

  // ---------- Helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function inSeason() { var m = new Date().getMonth() + 1; return m >= 3 && m <= 10; }
  function grp(id) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === id) return GROUPS[i];
    return GROUPS[0];
  }
  function fertState(p, g) {
    if (g.fertEvery === null) return { kind: "never" };
    if (!inSeason()) return { kind: "pause" };
    if (p.sinceFert >= g.fertEvery) return { kind: "due" };
    return { kind: "waiting", remaining: g.fertEvery - p.sinceFert };
  }
  function mixBar(mix) {
    var h = '<div class="bar">';
    mix.forEach(function (m) {
      var c = MIX_COLORS[m.label] || "#94A3B8";
      h += '<div style="width:' + m.pct + "%;background:" + c + '" title="' + esc(m.label) + " " + m.pct + ' %"></div>';
    });
    h += '</div><div class="legend">';
    mix.forEach(function (m) {
      var c = MIX_COLORS[m.label] || "#94A3B8";
      h += "<span><i class=\"dot\" style=\"background:" + c + '"></i>' + esc(m.label) + " " + m.pct + " %</span>";
    });
    return h + "</div>";
  }

  // ---------- Rendering ----------
  var view = document.getElementById("view");

  function renderPlants() {
    var rows = state.plants.map(function (p) {
      var g = grp(p.groupId);
      var fs = fertState(p, g);
      var rank = fs.kind === "due" ? 0 : fs.kind === "waiting" ? fs.remaining : fs.kind === "pause" ? 500 : 900;
      return { p: p, g: g, fs: fs, rank: rank };
    });
    if (filter !== "all") rows = rows.filter(function (r) { return r.g.zone === filter; });
    rows.sort(function (a, b) { return a.rank - b.rank || a.p.name.localeCompare(b.p.name); });

    var dueCount = state.plants.filter(function (p) {
      return fertState(p, grp(p.groupId)).kind === "due";
    }).length;

    var h = '<div class="row" style="margin-bottom:10px">' +
      '<span class="badge dark">🧪 Fertilizer due: ' + dueCount + "</span>" +
      '<span class="badge ghost">' + state.plants.length + " plant" + (state.plants.length > 1 ? "s" : "") + "</span>" +
      '<span class="filters" style="margin-left:auto">' +
      '<button data-filter="all" class="' + (filter === "all" ? "active" : "") + '">All</button>' +
      '<button data-filter="Indoor" class="' + (filter === "Indoor" ? "active" : "") + '">Indoor</button>' +
      '<button data-filter="Outdoor" class="' + (filter === "Outdoor" ? "active" : "") + '">Outdoor</button>' +
      "</span></div>";

    if (!inSeason()) {
      h += '<div class="banner sky" style="margin-bottom:12px">❄️ Winter fertilizer break: from November to February, water by observation and plain water only — feeding a resting plant does nothing and the salts just pile up in the soil.</div>';
    }

    // Add form
    var g0 = grp(addGroup);
    h += '<div class="card"><div class="addform">' +
      '<span class="label" style="font-size:0.85rem">Add:</span>' +
      '<select id="f-group">';
    GROUPS.forEach(function (g) {
      h += '<option value="' + g.id + '"' + (g.id === addGroup ? " selected" : "") + ">" + g.icon + " " + esc(g.name) + "</option>";
    });
    h += '</select><select id="f-plant">';
    g0.plants.forEach(function (pn) {
      h += '<option value="' + esc(pn) + '">' + esc(pn) + "</option>";
    });
    h += '</select><input type="text" id="f-name" placeholder="Custom name (optional)" style="width:170px" />' +
      '<button class="btn mini" data-action="add">Add</button></div></div>';

    h += '<div class="grid">';
    rows.forEach(function (r) {
      var p = r.p, g = r.g, fs = r.fs;
      var banner;
      if (fs.kind === "due") {
        banner = '<div class="banner amber">🧪 Fertilizer with this watering</div>';
      } else if (fs.kind === "waiting") {
        banner = '<div class="banner slate">💧 Plain water — fertilizer in ' + fs.remaining + " watering" + (fs.remaining > 1 ? "s" : "") + "</div>";
      } else if (fs.kind === "pause") {
        banner = '<div class="banner sky">❄️ Plain water — winter fertilizer break (Nov.–Feb.)</div>';
      } else {
        banner = '<div class="banner grey">🪨 No fertilizer, ever</div>';
      }

      var btns = "";
      if (fs.kind === "due") {
        btns = '<div class="row">' +
          '<button class="btn mini outline" data-action="water" data-fert="0" data-id="' + p.id + '">Watered — plain</button>' +
          '<button class="btn mini" data-action="water" data-fert="1" data-id="' + p.id + '">💧 Watered + fertilizer</button></div>';
      } else if (fs.kind === "waiting" || fs.kind === "pause") {
        btns = '<div class="row"><button class="btn mini" data-action="water" data-fert="0" data-id="' + p.id + '">💧 Watered — plain</button></div>';
      }

      var foot = "";
      if (fs.kind !== "never") {
        foot = '<div class="foot small">' +
          (fs.kind === "pause"
            ? "Fertilizer becomes useful again in March."
            : p.sinceFert + " watering" + (p.sinceFert > 1 ? "s" : "") + " since the last fertilizer.") +
          "</div>";
      }

      h += '<div class="card">' +
        '<div class="row between"><div><div class="name">' + esc(p.name) + "</div>" +
        '<span class="badge" style="margin-top:4px">' + g.icon + " " + esc(g.name) + "</span></div>" +
        '<button class="x" data-action="remove" data-id="' + p.id + '" title="Remove">✕</button></div>' +
        banner + btns + foot + "</div>";
    });
    h += "</div>";
    view.innerHTML = h;
  }

  function renderMixes() {
    var h = '<div class="filters row" style="margin-bottom:10px">' +
      '<button data-filter="all" class="' + (filter === "all" ? "active" : "") + '">All</button>' +
      '<button data-filter="Indoor" class="' + (filter === "Indoor" ? "active" : "") + '">Indoor</button>' +
      '<button data-filter="Outdoor" class="' + (filter === "Outdoor" ? "active" : "") + '">Outdoor</button></div><div class="grid">';

    GROUPS.forEach(function (g) {
      if (filter !== "all" && g.zone !== filter) return;
      h += '<div class="card"><div class="row between"><strong>' + g.icon + " " + esc(g.name) + "</strong>" +
        '<span class="badge ghost">' + g.zone + "</span></div>" +
        mixBar(g.mix) +
        '<div class="small" style="margin:8px 0">🧪 ' +
        (g.fertEvery === null
          ? "No fertilizer"
          : "Fertilizer every " + (g.fertEvery === 1 ? "watering" : g.fertEvery + " waterings") + " (Mar.–Oct.)") +
        "</div>" +
        (g.note ? '<div class="small" style="color:#64748b">' + esc(g.note) + "</div>" : "") +
        '<div class="chips" style="margin-top:8px">';
      g.plants.forEach(function (pn) { h += '<span class="badge ghost">' + esc(pn) + "</span>"; });
      h += "</div></div>";
    });

    h += '</div><div class="card"><strong>House rules</strong><div class="small" style="margin-top:6px">' +
      "• Water by observation: soil dry at 2 cm depth, or a light pot.<br>" +
      "• One homogeneous mix — no drainage layer at the bottom of the pot (it only raises the perched water table).<br>" +
      "• Drilled pot, saucer emptied after watering.<br>" +
      "• Pots under 15 cm: crush bark and pumice.<br>" +
      "• Bark: soak overnight before use. Minerals: rinse off the dust.<br>" +
      "• Rule of thumb: an indoor mix should dry out in 2–3 days.<br>" +
      "• Fertilizer only during the growing season (March – October), never on bone-dry soil.</div></div>";
    view.innerHTML = h;
  }

  function renderStock() {
    var total = 0;
    STOCK.forEach(function (c) { total += c.items.length; });
    var h = '<div class="row" style="margin-bottom:10px"><span class="badge ghost">' +
      state.owned.length + " / " + total + " products owned</span></div>";

    STOCK.forEach(function (cat) {
      h += '<div class="card"><strong>' + esc(cat.cat) + "</strong>";
      cat.items.forEach(function (it) {
        var owned = state.owned.indexOf(it.id) >= 0;
        h += '<label class="stock-item' + (owned ? " owned" : "") + '">' +
          '<input type="checkbox" data-stock="' + it.id + '"' + (owned ? " checked" : "") + ' />' +
          "<div><div class=\"label\">" + esc(it.label) + "</div>" +
          '<div class="small">' + esc(it.note) + "</div></div></label>";
      });
      h += "</div>";
    });

    h += '<div class="card"><strong>Substitutions: equivalents &amp; dosages</strong><table style="margin-top:8px">' +
      "<tr><th>Replace…</th><th>With…</th><th>Dosage</th><th>Note</th></tr>";
    SUBST.forEach(function (s) {
      h += "<tr><td>" + esc(s[0]) + "</td><td><strong>" + esc(s[1]) + "</strong></td><td>" + esc(s[2]) + "</td><td>" + esc(s[3]) + "</td></tr>";
    });
    h += '</table><p class="small" style="margin-top:8px">Rule of thumb: mineral substitutes of equivalent grain size swap at equal volume. Only fine sand (halve the dose) and grain size (crush it for small pots) ever need adjusting.</p></div>';
    view.innerHTML = h;
  }

  function render() {
    document.querySelectorAll("nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    if (tab === "plantes") renderPlants();
    else if (tab === "melanges") renderMixes();
    else renderStock();
  }

  // ---------- Events ----------
  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      tab = b.getAttribute("data-tab");
      filter = "all";
      render();
    });
  });

  view.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action],[data-filter]");
    if (!el) return;

    if (el.hasAttribute("data-filter")) {
      filter = el.getAttribute("data-filter");
      render();
      return;
    }
    var action = el.getAttribute("data-action");
    if (action === "water") {
      var id = el.getAttribute("data-id");
      var fert = el.getAttribute("data-fert") === "1";
      state.plants.forEach(function (p) {
        if (p.id === id) p.sinceFert = fert ? 0 : p.sinceFert + 1;
      });
      save(); render();
    } else if (action === "remove") {
      var rid = el.getAttribute("data-id");
      state.plants = state.plants.filter(function (p) { return p.id !== rid; });
      save(); render();
    } else if (action === "add") {
      var gsel = document.getElementById("f-group");
      var psel = document.getElementById("f-plant");
      var nameIn = document.getElementById("f-name");
      var name = (nameIn.value || "").trim() || psel.value;
      state.plants.push({ id: uid(), name: name, groupId: gsel.value, sinceFert: 0 });
      if (nameIn) nameIn.value = "";
      save(); render();
    }
  });

  view.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "f-group") {
      addGroup = el.value;
      var psel = document.getElementById("f-plant");
      var g = grp(addGroup);
      psel.innerHTML = g.plants.map(function (pn) {
        return '<option value="' + esc(pn) + '">' + esc(pn) + "</option>";
      }).join("");
      return;
    }
    if (el.hasAttribute("data-stock")) {
      var id = el.getAttribute("data-stock");
      var idx = state.owned.indexOf(id);
      if (el.checked && idx < 0) state.owned.push(id);
      if (!el.checked && idx >= 0) state.owned.splice(idx, 1);
      save();
      var lab = el.closest(".stock-item");
      if (lab) lab.classList.toggle("owned", el.checked);
    }
  });

  render();
})();
</script>
</body>
</html>
