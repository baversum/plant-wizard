<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#7c3aed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Plant Wizard</title>
<style>
  :root {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1e1b2e;
    --cyan: #0891b2;
    --cyan-soft: #ecfeff;
    --cyan-line: #a5f3fc;
    --cyan-ink: #0e7490;
    --violet: #7c3aed;
    --violet-soft: #f5f3ff;
    --violet-line: #ddd6fe;
    --violet-ink: #6d28d9;
    --ink: #1e1b2e;
    --muted: #6b687f;
    --line: #eae7f5;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 48px;
    background: linear-gradient(180deg, #eefcfd 0%, #f6f2ff 45%, #fbfaff 100%);
    min-height: 100vh;
  }
  header {
    position: relative;
    background: linear-gradient(120deg, #06b6d4 0%, #6366f1 55%, #a855f7 100%);
    color: #fff; padding: 26px 16px 22px;
    border-radius: 0 0 26px 26px;
    box-shadow: 0 8px 24px rgba(124, 58, 237, .25);
  }
  header .inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  header svg.leaf { flex: 0 0 auto; width: 40px; height: 40px; }
  header h1 { font-size: 1.35rem; margin: 0; letter-spacing: .3px; }
  header p { margin: 3px 0 0; font-size: 0.8rem; opacity: .85; }
  .langbtn {
    position: absolute; top: 14px; right: 14px;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.5);
    border-radius: 8px; padding: 4px 5px; cursor: pointer; line-height: 0;
    display: flex; align-items: center;
  }
  .langbtn:hover { background: rgba(255,255,255,.38); }
  .langbtn svg { width: 24px; height: 16px; border-radius: 2px; display: block; }
  nav {
    position: sticky; top: 0; z-index: 10; display: flex; gap: 4px;
    background: rgba(251, 250, 255, .88);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    justify-content: center;
  }
  nav button {
    border: 0; background: transparent; padding: 8px 18px; border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; color: var(--muted); cursor: pointer;
    transition: all .15s ease;
  }
  nav button.active {
    background: linear-gradient(120deg, #06b6d4, #8b5cf6);
    color: #fff; box-shadow: 0 3px 10px rgba(139, 92, 246, .35);
  }
  main { max-width: 900px; margin: 0 auto; padding: 14px 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(124, 58, 237, .06);
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem;
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    color: var(--muted); background: var(--violet-soft);
  }
  .badge.dark { background: var(--violet-soft); color: var(--violet-ink); border-color: var(--violet-line); }
  .badge.ghost { background: #f6f4fc; color: var(--muted); }
  .banner {
    border-radius: 12px; padding: 9px 12px; font-size: 0.85rem; font-weight: 600;
    margin: 10px 0; border: 1px solid; border-left-width: 4px;
  }
  .due   { background: var(--violet-soft); border-color: var(--violet-line); border-left-color: var(--violet); color: var(--violet-ink); }
  .wait  { background: var(--cyan-soft);   border-color: var(--cyan-line);   border-left-color: var(--cyan);   color: var(--cyan-ink); }
  .pause { background: #f4f4f8; border-color: #e4e4ec; border-left-color: #a5a5ba; color: #55526b; }
  .grey  { background: #f8f7fb; border-color: var(--line); border-left-color: #c9c6d8; color: #908ca6; }
  button.btn {
    border: 0; background: linear-gradient(120deg, #06b6d4, #8b5cf6); color: #fff;
    padding: 8px 14px; font-size: 0.8rem; border-radius: 10px; cursor: pointer;
    font-weight: 600; box-shadow: 0 2px 8px rgba(139, 92, 246, .3);
  }
  button.btn.outline {
    background: #fff; color: var(--violet-ink); border: 1px solid var(--violet-line);
    box-shadow: none;
  }
  button.btn.mini { padding: 5px 11px; font-weight: 500; }
  button.x { border: 0; background: transparent; color: #b0adc0; cursor: pointer; font-size: 0.8rem; padding: 4px; }
  button.x:hover { color: #dc2626; background: #fef2f2; border-radius: 6px; }
  .name { font-weight: 700; font-size: 0.95rem; }
  .small { font-size: 0.75rem; color: var(--muted); }
  .foot { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  select, input[type="text"] {
    border: 1px solid #d8d4e8; border-radius: 10px; padding: 7px 9px; font-size: 0.85rem;
    background: #fff; color: var(--ink); max-width: 100%;
  }
  select:focus, input[type="text"]:focus { outline: 2px solid var(--cyan-line); outline-offset: 0; border-color: var(--cyan); }
  input[type="checkbox"] { width: 16px; height: 16px; accent-color: #8b5cf6; }
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #eeeaf8; margin: 6px 0 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .legend span { font-size: 0.68rem; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; }
  table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f4f2fa; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .stock-item { display: flex; gap: 10px; padding: 8px; border-radius: 10px; align-items: flex-start; }
  .stock-item:hover { background: var(--violet-soft); }
  .stock-item.owned .label { text-decoration: line-through; color: #b0adc0; }
  .label { font-weight: 600; font-size: 0.85rem; }
  .filters button {
    border: 0; background: transparent; padding: 5px 13px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .filters button.active {
    background: linear-gradient(120deg, #06b6d4, #8b5cf6); color: #fff;
  }
  .addform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  @media (max-width: 600px) {
    nav button { padding: 8px 11px; font-size: 0.78rem; }
    header .inner { justify-content: center; text-align: center; flex-direction: column; gap: 6px; }
    .langbtn { top: 10px; right: 10px; }
  }
</style>
</head>
<body>
<header>
  <button class="langbtn" id="langbtn" title="Français" aria-label="Switch language"></button>
  <div class="inner">
    <svg class="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22c0-6 2-13 9-16-.5 9-4 14-9 16z" fill="rgba(255,255,255,.18)"/>
      <path d="M12 22c0-5-1.5-10-6-13 .5 7 3 10.5 6 13z" fill="rgba(255,255,255,.10)"/>
    </svg>
    <div>
      <h1>Plant Wizard</h1>
      <p id="subtitle">Soil mixes &amp; fertilizer, by observation</p>
    </div>
  </div>
</header>
<nav>
  <button data-tab="plantes" class="active" id="nav-plantes">My plants</button>
  <button data-tab="melanges" id="nav-melanges">Mixes</button>
  <button data-tab="stock" id="nav-stock">Stock</button>

  };

  function G(id, name, zone, mix, fertEvery, note, plants, winterFeed, seasonEnd) {
    return { id: id, name: name, zone: zone, mix: mix, fertEvery: fertEvery, note: note, plants: plants, winterFeed: !!winterFeed, seasonEnd: seasonEnd || 10 };
  }
  function M(label, pct) { return { label: label, pct: pct }; }

  var GROUPS = [
    G("tropicals", "Tropicals & aroids", "Indoor",
      [M("Potting soil", 40), M("Bark", 25), M("Pumice", 20), M("Coco", 15)], 2,
      "Let the top centimetre dry out between waterings.",
      ["Pothos", "Monstera", "Aglaonema", "Ficus", "ZZ", "Philodendron", "Syngonium"]),
    G("anthurium", "Anthuriums", "Indoor",
      [M("Potting soil", 30), M("Bark", 35), M("Coco", 20), M("Pumice", 15)], 2,
      "Thick roots: never leave water sitting in the saucer. The airiest mix of them all. A flowering fertilizer helps push blooms. In a warm, bright spot it can bloom year-round — if it pushes a spike in winter, a light half-dose feed won't hurt.",
      ["Anthurium"]),
    G("semi-succulents", "Semi-succulents", "Indoor",
      [M("Potting soil", 55), M("Pumice", 30), M("Crushed bark", 15)], 3,
      "Should dry out in 2–3 days. Stems turning black at the base means too wet. Kalanchoe blooms in winter thanks to short days — no feed needed while it blooms.",
      ["Tradescantia", "Kalanchoe", "Gasteraloe"]),
    G("cacti", "Succulents & cacti", "Indoor",
      [M("Potting soil", 35), M("Pumice", 45), M("Sand", 20)], 4,
      "Let it dry fully between waterings. Fertilize rarely, at half dose, spring to early autumn so growth hardens before winter.",
      ["Cactus", "Echeveria", "Haworthia", "Crassula"], false, 9),
    G("epiphytes", "Forest epiphytes", "Indoor",
      [M("Potting soil", 50), M("Bark", 25), M("Pumice", 25)], 3,
      "Rich yet very free-draining. Never bone dry.",
      ["Christmas cactus", "Rhipsalis"]),
    G("fine-roots", "Fine-rooted plants", "Indoor",
      [M("Potting soil", 70), M("Pumice", 20), M("Coco", 10)], 2,
      "Everything crushed, for small pots. Oxalis: the purple-leaved kinds grow in autumn-winter and sleep in summer — follow the leaves, light feed while it's in leaf.",
      ["Oxalis", "Begonia", "Peperomia", "Fittonia"]),
    G("bulbs", "Bulbs & tubers", "Indoor",
      [M("Potting soil", 80), M("Pumice", 20)], 2,
      "Calla lilies never want to dry out in the growing season. Amaryllis: the winter bloom runs on the bulb's reserves — feeding pauses during it; high-potash feeds from March to September then refill the bulb. White calla (aethiopica) grows autumn-spring, colored hybrids in summer — follow the leaves. The mix stays lean, fertility comes from the liquid feeds.",
      ["Amaryllis", "Zantedeschia (calla)", "Cyperus"]),
    G("ferns", "Ferns", "Indoor",
      [M("Potting soil", 60), M("Coco", 25), M("Pumice", 15)], 2,
      "Keep evenly moist, never soggy.",
      ["Boston fern", "Pteris"]),
    G("orchids", "Orchids", "Indoor",
      [M("Bark", 90), M("Pumice", 10)], 3,
      "Soak the pot for 10 minutes, then drain. Balanced fertilizer at half dose on damp roots.",
      ["Phalaenopsis"]),
    G("mediterranean", "Mediterranean (potted)", "Outdoor",
      [M("Potting soil", 50), M("Pumice", 30), M("Sand", 20)], 4,
      "Once established, water sparingly. Protect pots from frost — roots in pots get the cold first. Fermented teas from March to August: autumn feeding makes soft growth that fears frost.",
      ["Strawberry tree", "Olive", "Lavender", "Rosemary", "Pomegranate"], false, 8),
    G("potted-flowers", "Flowering container plants", "Outdoor",
      [M("Potting soil", 50), M("Garden soil", 25), M("Pumice", 25)], 1,
      "Petunias and surfinias: flowering fertilizer weekly in summer — the hungriest plants in the garden. Empty the saucer.",
      ["Geranium", "Surfinia", "Petunia", "Pelargonium"]),
    G("hellebores", "Hellebores (potted)", "Outdoor",
      [M("Potting soil", 50), M("Garden soil", 25), M("Pumice", 25)], 2,
      "Winter grower: it buds and blooms from November to March, so it keeps a light liquid feed (half dose) through the cold months while everything else rests. Deep pot, humus-rich mix, never bone dry; trim the old leaves as buds appear.",
      ["Hellebore"], true),
    G("rockery", "Rockery succulents", "Outdoor",
      [M("Potting soil", 25), M("Pumice", 75)], null,
      "Water only at planting and in heatwaves. Mineral mulch on top, zero fertilizer.",
      ["Sedum", "Sempervivum", "Delosperma"]),
    G("acid-lovers", "Acid-loving plants", "Outdoor",
      [M("Ericaceous soil", 60), M("Crushed bark", 20), M("Pumice", 20)], 3,
      "pH 4.5–5.5: no lime, ever. Rainwater only. Chelated iron when the leaves turn yellow (chlorosis). Camellias and azaleas set their buds in summer — the summer feeds are what fuel the winter bloom.",
      ["Blueberry", "Camellia", "Hydrangea", "Azalea"])
  ];

  var STOCK = [
    { cat: "Substrates", items: [
      { id: "potting-soil", label: "Quality all-purpose potting soil", note: "The base of every mix — light and airy, but low in nutrients" },
      { id: "bark", label: "Pine bark 10/25 mm", note: "Soak overnight before use; crush for small pots. Doubles as surface mulch for Mediterranean pots" },
      { id: "coco", label: "Coco coir (bricks)", note: "Rehydrate before mixing" },
      { id: "pumice", label: "Pumice 8/16 mm", note: "The one mineral that does it all — hammer-crush for small pots; doubles as mineral mulch on rockeries" },
      { id: "ericaceous", label: "Ericaceous potting soil", note: "Acid-lovers only (blueberry, camellia, hydrangea…)" }
    ]},
    { cat: "Fertilizers — a stack of 3", items: [
      { id: "fermented-teas", label: "Fermented nettle + horsetail + comfrey blend (5 L → 100 L)", note: "The everyday feed, indoors and out: nitrogen + potash + silica. Diluted to 5 %, every 2–3 weeks, March to October" },
      { id: "bloom-feed", label: "Liquid flowering fertilizer, high P-K (Algoflash 1 L or similar)", note: "Bloomers: anthurium, calla, begonia, oxalis, amaryllis after bloom; petunias and surfinias weekly in summer" },
      { id: "chelated-iron", label: "Chelated iron (Sequestrine-type) or ericaceous fertilizer", note: "For acid-lovers (blueberry) when leaves turn yellow" }
    ]}
  ];

  var SUBST = [
    ["Pumice", "Perlite", "Same volume", "Lighter and floats: fine indoors, avoid outdoors"],
    ["Pumice", "Crushed clay pebbles", "Same volume", "Rinse off the crushing dust"],
    ["Pumice", "Whole clay pebbles 8/16", "Same (large pots)", "Less aeration: add 5 % more if the mix stays dense"],
    ["Pumice", "Filter sand (0.4–0.8 mm)", "÷ 2 — e.g. 30 % → 15 %", "Sand densifies instead of aerating. Keep it under 20 % of the mix and top up with potting soil"],
    ["Pumice", "Concrete gravel 4/8", "Same volume", "Often limestone (alkaline): never for acid-lovers"],
    ["Bark", "Crushed pumice", "Same volume", "A slightly drier mix: water a little more often"],
    ["Coco", "Blonde peat", "Same volume", "Peat needs rehydrating too"]
  ];

  // ---------- State ----------
  var LS_KEY = "plant-wizard-v1";
  var SEED = [
    ["Pothos", "tropicals"], ["Monstera", "tropicals"], ["Anthurium", "anthurium"],
    ["Tradescantia", "semi-succulents"], ["Christmas cactus", "epiphytes"],
    ["Amaryllis", "bulbs"], ["Strawberry tree", "mediterranean"],
    ["Blueberry", "acid-lovers"], ["Geranium", "potted-flowers"]
  ];

  function seedPlants() {
    return SEED.map(function (s) { return { id: uid(), name: s[0], groupId: s[1], sinceFert: 0 }; });
  }
  function uid() {
    return "p-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (Array.isArray(p.plants)) {
          p.plants.forEach(function (pl) {
            if (pl && pl.groupId === "potted-flowers" && typeof pl.name === "string") {
              var n = pl.name.toLowerCase();
              if (n.indexOf("helleb") > -1 || n.indexOf("helléb") > -1 || n.indexOf("helleborus") > -1) {
                pl.groupId = "hellebores";
              }
            }
          });
          return { plants: p.plants, owned: Array.isArray(p.owned) ? p.owned : [] };
        }
      }
    } catch (e) { /* storage unavailable */ }
    return { plants: seedPlants(), owned: [] };
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* in-memory only */ }
  }

  var state = loadState();
  var tab = "plantes";
  var filter = "all";
  var addGroup = GROUPS[0].id;

  // ---------- Helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function inSeason(g) { var m = new Date().getMonth() + 1; var end = (g && g.seasonEnd) || 10; return m >= 3 && m <= end; }
  function grp(id) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === id) return GROUPS[i];
    return GROUPS[0];
  }
  function fertState(p, g) {
    if (g.fertEvery === null) return { kind: "never" };
    if (!inSeason(g)) {
      if (g.winterFeed) {
        return p.sinceFert >= g.fertEvery ? { kind: "wdue" } : { kind: "waiting", remaining: g.fertEvery - p.sinceFert };
      }
      return { kind: "pause" };
    }
    if (p.sinceFert >= g.fertEvery) return { kind: "due" };
    return { kind: "waiting", remaining: g.fertEvery - p.sinceFert };
  }
  function mixBar(mix) {
    var h = '<div class="bar">';
    mix.forEach(function (m) {
      var c = MIX_COLORS[m.label] || "#94A3B8";
      h += '<div style="width:' + m.pct + "%;background:" + c + '" title="' + esc(mixLabel(m.label)) + " " + m.pct + ' %"></div>';
    });
    h += '</div><div class="legend">';
    mix.forEach(function (m) {
      var c = MIX_COLORS[m.label] || "#94A3B8";
      h += "<span><i class=\"dot\" style=\"background:" + c + '"></i>' + esc(mixLabel(m.label)) + " " + m.pct + " %</span>";
    });
    return h + "</div>";
  }

  // ---------- Rendering ----------
  var view = document.getElementById("view");

  function renderPlants() {
    var rows = state.plants.map(function (p) {
      var g = grp(p.groupId);
      var fs = fertState(p, g);
      var rank = (fs.kind === "due" || fs.kind === "wdue") ? 0 : fs.kind === "waiting" ? fs.remaining : fs.kind === "pause" ? 500 : 900;
      return { p: p, g: g, fs: fs, rank: rank };
    });
    if (filter !== "all") rows = rows.filter(function (r) { return r.g.zone === filter; });
    rows.sort(function (a, b) { return a.rank - b.rank || a.p.name.localeCompare(b.p.name); });

    var dueCount = state.plants.filter(function (p) {
      var k = fertState(p, grp(p.groupId)).kind;
      return k === "due" || k === "wdue";
    }).length;

    var h = '<div class="row" style="margin-bottom:10px">' +
      '<span class="badge dark">' + T.dueBadge + " " + dueCount + "</span>" +
      '<span class="badge ghost">' + state.plants.length + " " + (state.plants.length > 1 ? T.plantsBadgePl : T.plantsBadgeSg) + "</span>" +
      '<span class="filters" style="margin-left:auto">' +
      '<button data-filter="all" class="' + (filter === "all" ? "active" : "") + '">' + T.filters.all + "</button>" +
      '<button data-filter="Indoor" class="' + (filter === "Indoor" ? "active" : "") + '">' + T.filters.Indoor + "</button>" +
      '<button data-filter="Outdoor" class="' + (filter === "Outdoor" ? "active" : "") + '">' + T.filters.Outdoor + "</button>" +
      "</span></div>";

    if (!inSeason()) {
      h += '<div class="banner pause" style="margin-bottom:12px">' + T.winterBanner + "</div>";
    }

    // Add form
    var g0 = grp(addGroup);
    h += '<div class="card"><div class="addform">' +
      '<span class="label" style="font-size:0.85rem">' + T.addLabel + "</span>" +
      '<select id="f-group">';
    GROUPS.forEach(function (g) {
      h += '<option value="' + g.id + '"' + (g.id === addGroup ? " selected" : "") + ">" + esc(gname(g)) + "</option>";
    });
    h += '</select><select id="f-plant">';
    g0.plants.forEach(function (pn) {
      h += '<option value="' + esc(pn) + '">' + esc(plantName(pn)) + "</option>";
    });
    h += '</select><input type="text" id="f-name" placeholder="' + T.customName + '" style="width:170px" />' +
      '<button class="btn mini" data-action="add">' + T.addBtn + "</button></div></div>";

    h += '<div class="grid">';
    rows.forEach(function (r) {
      var p = r.p, g = r.g, fs = r.fs;
      var banner;
      if (fs.kind === "due") {
        banner = '<div class="banner due">' + T.bannerDue + "</div>";
      } else if (fs.kind === "wdue") {
        banner = '<div class="banner due">' + T.bannerWinterDue + "</div>";
      } else if (fs.kind === "waiting") {
        banner = '<div class="banner wait">' + T.bannerWaitPre + " " + fs.remaining + " " +
          (fs.remaining > 1 ? T.bannerWaitPl : T.bannerWaitSg) + "</div>";
      } else if (fs.kind === "pause") {
        banner = '<div class="banner pause">' + T.bannerPause + "</div>";
      } else {
        banner = '<div class="banner grey">' + T.bannerNever + "</div>";
      }

      var btns = "";
      if (fs.kind === "due" || fs.kind === "wdue") {
        btns = '<div class="row">' +
          '<button class="btn mini outline" data-action="water" data-fert="0" data-id="' + p.id + '">' + T.waterPlain + "</button>" +
          '<button class="btn mini" data-action="water" data-fert="1" data-id="' + p.id + '">' + T.waterFert + "</button></div>";
      } else if (fs.kind === "waiting" || fs.kind === "pause") {
        btns = '<div class="row"><button class="btn mini" data-action="water" data-fert="0" data-id="' + p.id + '">' + T.waterPlain + "</button></div>";
      }

      var foot = "";
      if (fs.kind !== "never") {
        foot = '<div class="foot small">' +
          (fs.kind === "pause"
            ? T.footPause
            : fs.kind === "wdue"
            ? T.footWinter
            : p.sinceFert === 0
            ? T.footJustFed
            : p.sinceFert + " " + (p.sinceFert > 1 ? T.footSincePl : T.footSinceSg)) +
          "</div>";
      }

      h += '<div class="card">' +
        '<div class="row between"><div><div class="name">' + esc(plantName(p.name)) + "</div>" +
        '<span class="badge" style="margin-top:4px">' + esc(gname(g)) + "</span></div>" +
        '<button class="x" data-action="remove" data-id="' + p.id + '" title="' + T.remove + '">×</button></div>' +
        banner + btns + foot + "</div>";
    });
    h += "</div>";
    view.innerHTML = h;
  }

  function renderMixes() {
    var h = '<div class="filters row" style="margin-bottom:10px">' +
      '<button data-filter="all" class="' + (filter === "all" ? "active" : "") + '">' + T.filters.all + "</button>" +
      '<button data-filter="Indoor" class="' + (filter === "Indoor" ? "active" : "") + '">' + T.filters.Indoor + "</button>" +
      '<button data-filter="Outdoor" class="' + (filter === "Outdoor" ? "active" : "") + '">' + T.filters.Outdoor + '</button></div><div class="grid">';

    GROUPS.forEach(function (g) {
      if (filter !== "all" && g.zone !== filter) return;
      h += '<div class="card"><div class="row between"><strong>' + esc(gname(g)) + "</strong>" +
        '<span class="badge ghost">' + zone(g.zone) + "</span></div>" +
        mixBar(g.mix) +
        '<div class="small" style="margin:8px 0">' +
        (g.fertEvery === null
          ? T.fertNever
          : T.fertEveryPre + " " + (g.fertEvery === 1 ? T.fertEveryW : g.fertEvery + " " + T.fertEveryPl) + " " + (g.winterFeed ? T.fertSeasonAll : seasonLabel(g))) +
        "</div>" +
        (gnote(g) ? '<div class="small" style="color:var(--muted)">' + esc(gnote(g)) + "</div>" : "") +
        '<div class="chips" style="margin-top:8px">';
      g.plants.forEach(function (pn) { h += '<span class="badge ghost">' + esc(plantName(pn)) + "</span>"; });
      h += "</div></div>";
    });

    h += '</div><div class="card"><strong>' + T.houseRules + '</strong><div class="small" style="margin-top:6px">' +
      T.rules.map(function (r) { return "• " + esc(r); }).join("<br>") + "</div></div>";
    view.innerHTML = h;
  }

  function renderStock() {
    var total = 0;
    STOCK.forEach(function (c) { total += c.items.length; });
    var h = '<div class="row" style="margin-bottom:10px"><span class="badge ghost">' +
      state.owned.length + " " + T.ownedMid + " " + total + " " + T.ownedEnd + "</span></div>";

    STOCK.forEach(function (cat) {
      h += '<div class="card"><strong>' + esc(catText(cat.cat)) + "</strong>";
      cat.items.forEach(function (it) {
        var owned = state.owned.indexOf(it.id) >= 0;
        h += '<label class="stock-item' + (owned ? " owned" : "") + '">' +
          '<input type="checkbox" data-stock="' + it.id + '"' + (owned ? " checked" : "") + ' />' +
          "<div><div class=\"label\">" + esc(stockText(it.id, 0, it.label)) + "</div>" +
          '<div class="small">' + esc(stockText(it.id, 1, it.note)) + "</div></div></label>";
      });
      h += "</div>";
    });

    h += '<div class="card"><strong>' + T.substTitle + '</strong><table style="margin-top:8px"><tr>';
    T.th.forEach(function (t) { h += "<th>" + esc(t) + "</th>"; });
    h += "</tr>";
    substRows().forEach(function (s) {
      h += "<tr><td>" + esc(s[0]) + "</td><td><strong>" + esc(s[1]) + "</strong></td><td>" + esc(s[2]) + "</td><td>" + esc(s[3]) + "</td></tr>";
    });
    h += '</table><p class="small" style="margin-top:8px">' + esc(T.substRule) + "</p></div>";
    view.innerHTML = h;
  }

  function renderChrome() {
    document.documentElement.setAttribute("lang", lang);
    var sub = document.getElementById("subtitle");
    if (sub) sub.textContent = T.subtitle;
    var btn = document.getElementById("langbtn");
    if (btn) {
      btn.innerHTML = lang === "fr" ? FLAG_EN : FLAG_FR;
      btn.title = lang === "fr" ? "English" : "Français";
      btn.setAttribute("aria-label", lang === "fr" ? "Switch to English" : "Passer en français");
    }
    document.getElementById("nav-plantes").textContent = T.nav.plantes;
    document.getElementById("nav-melanges").textContent = T.nav.melanges;
    document.getElementById("nav-stock").textContent = T.nav.stock;
  }

  function render() {
    renderChrome();
    document.querySelectorAll("nav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tab);
    });
    if (tab === "plantes") renderPlants();
    else if (tab === "melanges") renderMixes();
    else renderStock();
  }

  // ---------- Events ----------
  document.getElementById("langbtn").addEventListener("click", function () {
    lang = lang === "fr" ? "en" : "fr";
    T = STR[lang];
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    render();
  });

  document.querySelectorAll("nav button").forEach(function (b) {
    b.addEventListener("click", function () {
      tab = b.getAttribute("data-tab");
      filter = "all";
      render();
    });
  });

  view.addEventListener("click", function (e) {
    var el = e.target.closest("[data-action],[data-filter]");
    if (!el) return;

    if (el.hasAttribute("data-filter")) {
      filter = el.getAttribute("data-filter");
      render();
      return;
    }
    var action = el.getAttribute("data-action");
    if (action === "water") {
      var id = el.getAttribute("data-id");
      var fert = el.getAttribute("data-fert") === "1";
      state.plants.forEach(function (p) {
        if (p.id === id) p.sinceFert = fert ? 0 : p.sinceFert + 1;
      });
      save(); render();
    } else if (action === "remove") {
      var rid = el.getAttribute("data-id");
      state.plants = state.plants.filter(function (p) { return p.id !== rid; });
      save(); render();
    } else if (action === "add") {
      var gsel = document.getElementById("f-group");
      var psel = document.getElementById("f-plant");
      var nameIn = document.getElementById("f-name");
      var name = (nameIn.value || "").trim() || psel.value;
      state.plants.push({ id: uid(), name: name, groupId: gsel.value, sinceFert: 0 });
      if (nameIn) nameIn.value = "";
      save(); render();
    }
  });

  view.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "f-group") {
      addGroup = el.value;
      var psel = document.getElementById("f-plant");
      var g = grp(addGroup);
      psel.innerHTML = g.plants.map(function (pn) {
        return '<option value="' + esc(pn) + '">' + esc(plantName(pn)) + "</option>";
      }).join("");
      return;
    }
    if (el.hasAttribute("data-stock")) {
      var id = el.getAttribute("data-stock");
      var idx = state.owned.indexOf(id);
      if (el.checked && idx < 0) state.owned.push(id);
      if (!el.checked && idx >= 0) state.owned.splice(idx, 1);
      save();
      var lab = el.closest(".stock-item");
      if (lab) lab.classList.toggle("owned", el.checked);
    }
  });

  render();
})();
</script>
</body>
</html>
